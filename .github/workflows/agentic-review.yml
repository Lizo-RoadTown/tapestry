name: Agentic code review (advisory)

# Phase 0 dogfood — TAPESTRY repo only. NOT the fleet-wide template yet
# (templating into `tapestry init` is the next phase; see
# docs/how-to/agentic-code-review.md and docs/plans/2026-09-05-legibility-review-and-plan.md Part C).
#
# ADVISORY ONLY. Both jobs post comments; neither approves, requests changes, nor
# blocks merge. This workflow is NOT a required check — keep lint/types/tests and
# plugin-version-check.yml as the deterministic required checks. Humans own merge.
#
# OPERATOR SETUP (one step): set the ANTHROPIC_API_KEY repo (or org) secret:
#   gh secret set ANTHROPIC_API_KEY --repo Lizo-RoadTown/tapestry
# Without it, both jobs fail — advisory, so a failed run never blocks a PR, but no
# review is posted. Do NOT hardcode the key here.
#
# FORK SAFETY: this runs on pull_request (not pull_request_target), so a fork PR
# gets no write token and no repo secrets — the jobs simply no-op on the missing
# key rather than leaking it. The security-review action is NOT hardened against
# prompt injection from untrusted diffs; before enabling review on external/fork
# PRs, gate it behind maintainer approval (Settings > Actions > "Require approval
# for all outside collaborators") or a manual label check. Keep action versions
# pinned (below) so a compromised upstream tag can't silently change behavior.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Least privilege. `contents: read` to check out the diff; `pull-requests: write`
# to post review comments; `id-token: write` for the action's OIDC auth.
permissions:
  contents: read
  pull-requests: write
  id-token: write

# One review in flight per PR; a new push cancels the stale run to bound cost.
concurrency:
  group: agentic-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-review:
    name: Claude code review (correctness + reuse/simplify/efficiency)
    # Non-draft PRs only, to bound per-PR cost.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Pinned to the maintained v1 major tag (see docs for the pin-to-SHA option).
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Automation mode: prompt-driven, no @claude mention needed.
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }} in
            ${{ github.repository }}. This is an ADVISORY review — you never approve
            or request changes; you only leave comments.

            DEFER TO DETERMINISTIC CI. Separate required checks already cover
            linting, type-checking, tests, and plugin-version alignment. Do NOT
            restate or duplicate lint/type/test/formatting findings — if a
            deterministic tool would catch it, stay silent and let that check speak.

            Review ONLY the diff for this PR. Focus on what deterministic CI cannot:
              - Correctness: real bugs, logic errors, edge cases, unsafe assumptions.
              - Reuse: an existing helper/util/pattern in this repo the change should
                use instead of reimplementing.
              - Simplify: clearer or smaller equivalents of the changed code.
              - Efficiency: avoidable work, N+1s, needless allocations/passes.

            Match Tapestry's tone (CLAUDE.md): plain and descriptive, no marketing
            voice. Prefer a few high-confidence comments over broad speculation. If
            the diff looks good, say so briefly and post nothing inline.

            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) to attach specific findings to the relevant lines.
            Use `gh pr comment` only for a short top-level summary.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          # Advisory review: no persistent progress/sticky comment noise.
          track_progress: false
          use_sticky_comment: false

  security-review:
    name: Claude security review (diff-aware, advisory)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The action diffs the PR head against its base.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      # No release tags exist for this action, so pin to a commit SHA rather than a
      # moving @main. Update deliberately by bumping the SHA in a PR.
      # SHA below = anthropics/claude-code-security-review main @ 2026-02-11.
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
          # False-positive filtering is on by default; the action ships its own
          # filtering instructions. Left explicit here for legibility.
          upload-results: true
