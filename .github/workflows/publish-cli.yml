name: Publish tapestry-cli to PyPI

# Publishes packages/cli to PyPI via PyPI Trusted Publishing (OIDC).
# No API token is stored anywhere — PyPI verifies the GitHub identity directly.
#
# To cut a release:
#   1. One-time on PyPI (https://pypi.org/manage/account/publishing/), add a
#      pending publisher:
#        PyPI project name: tapestry-cli
#        Owner:             Lizo-RoadTown
#        Repository:        tapestry
#        Workflow name:     publish-cli.yml
#        Environment:       pypi
#   2. Bump the version in packages/cli/pyproject.toml.
#   3. Create a GitHub Release whose tag is `tapestry-cli-v<version>`
#      (e.g. tapestry-cli-v0.1.0). This workflow builds + publishes.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    # Only run for this package's release tags, so other releases don't trigger it.
    if: startsWith(github.event.release.tag_name, 'tapestry-cli-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Job-level permissions REPLACE the workflow-level set, so contents:read
      # must be granted here too or actions/checkout cannot read the repo.
      id-token: write   # required for Trusted Publishing (OIDC)
      contents: read    # required for actions/checkout
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
        working-directory: packages/cli

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/cli/dist
