      <stop offset="0" stop-color="#13333d"/><stop offset="0.5" stop-color="#3f8b95"/><stop offset="1" stop-color="#13333d"/>
    </linearGradient>
    <radialGradient id="gCore" cx="0.5" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#eafdfe"/><stop offset="0.4" stop-color="#5fd3da"/><stop offset="1" stop-color="#5fd3da" stop-opacity="0"/>
