# Reconstruction manifest — procedure v0.1, step 10 record shape.
# Stable IDs are permanent; provisional_name is NOT a final name (step 8: names come last).
# implementation_state / deployment_state / trigger_type are separate; "unknown" is honest, never guessed away.
#
# ID REGISTER RECONCILIATION (2026-10-21, same day as assignment): this manifest briefly used a
# component-NNN register while the master plan used pl-*/sh-*. One canonical scheme now:
#   pl-*  personal layer (one person, many projects) — assigned here and in the master plan
#   sh-*  shared across both layers
#   pr-*  program layer (one project, many people) — OWNED BY LENS-CORE (see program_layer_ids)
# The component-NNN numbers are retired unused and are never reused; each row keeps its
# former_id for traceability. Cite IDs, not names.
