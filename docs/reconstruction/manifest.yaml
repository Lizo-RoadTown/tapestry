connections:
  - id: conn-001
    producer: component-003
    consumer: component-002
    contract: flat hook-event JSON (ts, hook, phase, scope_in, action, note, exit_code, elapsed_ms, session_id, tool_name, project_id)
    identity_fields: server-side uuid5(session_id|hook_name|phase|tool_name|raw_ts); NO artifact_ref today (identity gap)
    trigger: every hook event
    transport: HTTPS POST /hook-events, X-Loom-Hook-Signature HMAC (LOOM_HOOK_BRIDGE_SECRET)
    access_scope: write-only, signed
    delivery_behavior: fire-and-forget at sender; effectively-once at DB (ON CONFLICT DO NOTHING); manual backfill via flush_hooks_jsonl.py
    failure_handling: sender drops on failure; local hooks.jsonl retains for manual flush; flush default path misses project-local logs
    evidence: "_observability.py:375-528; hook_event_handler.py:174-273"
    status: BROKEN (wire X1 - LOOM_INGEST_ENDPOINT unset; push is a silent no-op)
  - id: conn-002
    producer: Make_Skills engine telemetry sender
    consumer: component-002
    contract: TelemetryBatch (Pydantic, extra=forbid)
    identity_fields: artifact_ref "skill/<uuid>" (the ONLY producer emitting artifact_refs today)
    trigger: skill usage batches
    transport: HTTPS POST /skill-used, X-MakeSkills-Signature HMAC (LOOM_SKILL_BRIDGE_SECRET)
    access_scope: write-only, signed
    delivery_behavior: batch
    failure_handling: none needed at receiver today because the deployed receiver verifies, logs, and DISCARDS
    evidence: "the-loom main.py:67-70; target URL distributed by the legacy registry (promote_dispatcher.py:287-291)"
    status: BROKEN (wire X2 - data discarded on arrival; callback repoint required)
  - id: conn-003
    producer: component-004
    consumer: component-006
    contract: POST /candidates (source_path=path_b, evidence_refs self_observation)
    identity_fields: content hash (dedup)
    trigger: 6-hourly cron
    transport: HTTPS
    access_scope: write, service-auth
    delivery_behavior: at-least-once with content-hash dedup
    failure_handling: GitHub token expiry silently degrades the scan to public repos
    evidence: "self-observer candidate_client.py:42-67; first live scan 2026-09-06 (12 repos)"
    status: WORKING
  - id: conn-004
    producer: component-006
    consumer: component-008
    contract: HMAC-signed PromotionCandidate -> /bridge/promotion-candidate; RegistrationAck back to /skill-registered
    identity_fields: candidate id; idempotency at receiver
    trigger: PATCH status to promotion_requested with kind=skill (auto-dispatch BackgroundTask)
    transport: HTTPS, HMAC
    access_scope: service-to-service, signed
    delivery_behavior: dispatch + acknowledgement loop
    failure_handling: only kind=skill has a handler; the other 8 kinds dead-end (ADR-0001 deferred item)
    evidence: "the-loom main.py:234-259; promote_dispatcher.py:101-105"
    status: WORKING (kind=skill only)
  - id: conn-005
    producer: component-001
    consumer: every agent session (bidirectional)
    contract: MCP tools + REST /v1; records with name, record_type, content, project_tags
    identity_fields: record name
    trigger: per session (auto-recall at SessionStart; writes during work)
    transport: HTTPS, bearer (TAPESTRY_MEMORY_API_KEY); self-host fallback tenants
    access_scope: per-tenant
    delivery_behavior: synchronous
    failure_handling: Core Directive 1 - sessions halt rather than work without memory
    evidence: "services/agent-context/main.py:1-24; .mcp.json in every managed repo"
    status: WORKING (known defect - WAF 403 on some content)
  - id: conn-006
    producer: component-005
    consumer: observation_signals table -> component-016 (and component-009, future)
    contract: atomic per-run snapshot INSERT; signals are evidence, never candidates
    identity_fields: artifact_ref + window (aggregates, not event ids)
    trigger: 6h cron (compute_signals.py --once)
    transport: in-DB within one RLS transaction
    access_scope: tenant-scoped (fail-closed on SELF_HOST_TENANT_ID)
    delivery_behavior: snapshot per run
    failure_handling: fails closed on missing tenant
    evidence: "signals.py:83-136; compute_signals.py:26-48"
    status: BROKEN (wire X3 - staging only, autoDeploy false; also input-starved until artifact identity exists)
  - id: conn-007
    producer: component-002 (read API)
    consumer: component-004
    contract: GET /telemetry/invocations?repo=&file_path= with the 0-vs-None distinction (never-seen -> null/known:false; seen-zero -> 0/known:true)
    identity_fields: artifact_ref = "{repo}#{file_path}" (NO producer writes this form today)
    trigger: during cron scan
    transport: HTTPS (read auth REQUIRED before deploy)
    access_scope: read, to-be-authenticated
    delivery_behavior: synchronous query
    failure_handling: stub returns None today, suppressing orphan verdicts
    evidence: "read_api.py:105-216; telemetry_client.py:21-34; config.py:152-155 legacy URL default"
    status: BROKEN (wire X4 - stub never swapped; identity form unproduced)
  - id: conn-008
    producer: class repos (skills + correction records)
    consumer: component-010 -> catalog -> correction-triage -> education-plugins -> class repos
    contract: GitHub reads; human-merged PRs out
    identity_fields: blob sha per skill file
    trigger: manual (operator-run)
    transport: GitHub API + git
    access_scope: operator token
    delivery_behavior: on-demand full scan
    failure_handling: daily Action skips on missing secret
    evidence: "education-lab task inventory 2026-10-21; handoff-tapestry-education-lab-task-inventory-2026-10-21"
    status: WORKING (manual only)

