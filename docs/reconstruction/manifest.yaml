# Program-layer ID register. Owner: lens-core. Source of truth: lens-core decomposition.json "ids"
# (with "retired_ids"). Enforced by lens-core scripts/roadmap.py check_ids in CI: every module and
# proposed repo has a unique pr-NNN; a removed module's ID moves to retired_ids; retired IDs are
# never reused. Evidence: lens-core commit 62af9f8. Rule: cite IDs, not names.
program_layer_ids:
  register_owner: lens-core
  source_of_truth: lens-core decomposition.json "ids" (with "retired_ids")
  enforcement: lens-core scripts/roadmap.py check_ids (CI)
  evidence: "lens-core 62af9f8"
  ids:
    - { id: pr-001, module: lens-core }
    - { id: pr-002, module: lens-ingest }
    - { id: pr-003, module: lens-review }
    - { id: pr-004, module: lens-serve }
    - { id: pr-005, module: lens-observe }
    - { id: pr-006, module: "workflow oversight (proposed; descriptive label until step 8)" }
    - { id: pr-007, module: "access + tenancy (proposed; descriptive label until step 8)" }

