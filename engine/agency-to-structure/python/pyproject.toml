[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agency-to-structure"
version = "0.1.0"
description = "Tapestry's recursive-skill runtime engine — deepagents wiring + per-tenant runtime + in-process subagent dispatch (ported from Make_Skills core/runtime per audit §2.2)"
requires-python = ">=3.10"
dependencies = [
    "loom-auth>=0.1.0",
    "loom-sdk>=0.1.0",
    # Runtime-only: pulled in by service consumers
    # - deepagents (create_deep_agent)
    # - langgraph (AsyncPostgresSaver)
    # - langchain-core (BaseChatModel)
    # - psycopg[binary,pool]
    # Listed here so the service's requirements.txt can `agency-to-structure[runtime]`
]

[project.optional-dependencies]
runtime = [
    "deepagents>=0.1",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "psycopg[binary,pool]>=3.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agency_to_structure*"]
