# render.yaml — Tapestry deploy blueprint
#
# ============================================================================
# STATUS: STAGING-FIRST DRAFT for Step 2 (agent-context MCP). NOT a prod deploy.
# Governed by docs/migration-cicd/runbooks/02-agent-context-mcp.md. Do NOT sync
# the production block until that runbook clears its parity + prod gates.
# ============================================================================
#
# CRITICAL mechanics (from the 2026-06-20 research/eval pass):
#
#  - NO `databases:` block. Tapestry does NOT create a new Postgres. It reuses
#    the EXISTING `loom-postgres`. Per Render IaC docs, a `fromDatabase:` ref in
#    a second blueprint would spawn a NEW empty suffixed DB (data divergence) —
#    so the DB connection is supplied as a `sync:false` SECRET (the raw
#    connection string), NOT `fromDatabase`.
#
#  - ONE-BLUEPRINT invariant: only ONE blueprint may deploy a given service at a
#    time. Before the production `loom-agent-context` block below is enabled, the
#    the-loom blueprint must stop deploying it (set autoDeploy:false / remove it).
#
#  - SERVICE NAME PRESERVED at prod (`loom-agent-context`) → same URL → every
#    consumer `.mcp.json` is unchanged. Rollback = re-point Render at the-loom.
#
#  - Secrets COPIED byte-identical from loom-shared-secrets (no rotation):
#    LOOM_JWT_PUBLIC_KEY, LOOM_JWT_PRIVATE_KEY (issuer only). SELF_HOST_TENANT_ID
#    stays the in-code constant (1d8ec1b3-…) — must not drift or RLS returns empty.

envVarGroups:
  - name: tapestry-shared-secrets
    envVars:
      - key: LOOM_JWT_PUBLIC_KEY
        sync: false                  # copy byte-identical from loom-shared-secrets
      # OTEL_* telemetry vars added when project-observatory/telemetry migrate (Step 7a)

services:

  # --------------------------------------------------------------------------
  # STAGING — agent-context MCP. Distinct name (never collides with prod).
  # Points at a FRESH EMPTY staging Postgres (NOT a snapshot of loom-postgres;
  # prod reuses the real DB, so data-identity is a prod invariant).
  # DEPLOYED + parity GREEN 2026-06-20.
  # --------------------------------------------------------------------------
  - type: web
    name: tapestry-agent-context-staging
    runtime: python
    plan: starter
    region: oregon
    branch: main                     # deploys from tapestry main once Step 2 merges
    rootDir: services/agent-context
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: false                # manual — operator triggers staging deploys
    healthCheckPath: /health
    envVars:
      - fromGroup: tapestry-shared-secrets
      - key: PYTHON_VERSION
        value: "3.12"
      - key: LOOM_JWT_PRIVATE_KEY
        sync: false                  # copy from loom (issuer)
      - key: LOOM_DB_URL
        sync: false                  # raw connection string to a STAGING copy of loom-postgres (NOT prod)

  # --------------------------------------------------------------------------
  # STAGING — project-registry (Step 3). Distinct name. Fresh empty staging DB.
  # Governed by runbooks/03-project-registry.md. No deploy until that runbook's
  # gates clear. project-registry does not issue tokens (no private key).
  # --------------------------------------------------------------------------
  - type: web
    name: tapestry-project-registry-staging
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: services/project-registry
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - fromGroup: tapestry-shared-secrets
      - key: PYTHON_VERSION
        value: "3.12"
      - key: LOOM_DB_URL
        sync: false                  # raw connection string to a STAGING Postgres (NOT prod)

  # --------------------------------------------------------------------------
  # STAGING — project-observatory (Phase 1: the runtime-observer + read API).
  # Two deploy shapes from services/project-observatory:
  #   (a) a CRON running compute_signals.py --once every 6h — reads the 005
  #       telemetry substrate, computes hot_path/orphaned/degrading, and writes
  #       one observation_signals snapshot (006). Cron pattern lifted from the
  #       self-observer (the-loom/render.yaml:292-302).
  #   (b) a WEB service serving main.py — GET /observations/signals (the read
  #       layer over the snapshots) + /health.
  # Both reuse the existing loom-postgres via a sync:false LOOM_DB_URL, and both
  # REQUIRE SELF_HOST_TENANT_ID (they fail closed on the nil tenant): it MUST be
  # the SAME value the rest of the deployment uses, or RLS scopes them to a
  # different, empty tenant. Staging-first: autoDeploy:false, distinct -staging
  # names, staging DB. No prod block until a runbook clears the gates.
  # --------------------------------------------------------------------------
  - type: cron
    name: tapestry-project-observatory-cron-staging
    runtime: python
    schedule: "0 */6 * * *"          # every 6h — matches the self-observer cadence
    plan: starter                    # free rejects cron jobs
    region: oregon
    branch: main
    rootDir: services/project-observatory
    buildCommand: pip install -r requirements.txt
    startCommand: python compute_signals.py --once
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: LOOM_DB_URL
        sync: false                  # raw connection string to a STAGING copy of loom-postgres (NOT prod)
      - key: SELF_HOST_TENANT_ID
        sync: false                  # MUST match the deployment's tenant, or RLS returns empty

  - type: web
    name: tapestry-project-observatory-staging
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: services/project-observatory
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: LOOM_DB_URL
        sync: false                  # raw connection string to a STAGING copy of loom-postgres (NOT prod)
      - key: SELF_HOST_TENANT_ID
        sync: false                  # MUST match the deployment's tenant, or RLS returns empty

  # --------------------------------------------------------------------------
  # self-observer (migrated from the-loom; CORE DIRECTIVE 2) — writes to the LIVE registry.
  # A CRON running `python main.py --once` every 6h from services/self-observer:
  # it discovers scan targets (static core + every project-registry repo), scans
  # them via the GitHub contents API, classifies category-drift, and POSTs
  # candidates to architecture-registry. No DB — it is a pure HTTP client, so
  # no LOOM_DB_URL. Cron shape lifted from the project-observatory cron above.
  #
  # Endpoint defaults point at the EXISTING deployed services so restored data
  # appends to what's already there and the dashboard keeps working; override
  # via the TAPESTRY_* / LOOM_* env vars to retarget. Secrets are declared
  # sync:false (operator sets them in the Render dashboard):
  #   GITHUB_TOKEN  — read the PRIVATE consuming repos (else public-only scan)
  #   OBSERVER_JWT  — Bearer to the Tapestry services (unset => self-host tenant)
  # Unlike the observatory cron above (which targets a staging DB), this one
  # writes candidates to the LIVE architecture-registry BY DESIGN — that is the
  # point: it appends to your existing data + dashboard. So there is no "staging"
  # data path. Its safety is structural instead: autoDeploy:false + the two
  # required secrets mean it does NOTHING until the operator provisions
  # GITHUB_TOKEN/OBSERVER_JWT and manually enables the cron in the Render dashboard.
  # --------------------------------------------------------------------------
  - type: cron
    name: tapestry-self-observer-cron
    runtime: python
    schedule: "0 */6 * * *"          # every 6h — matches the observer cadence
    plan: starter                    # free rejects cron jobs
    region: oregon
    branch: main
    rootDir: services/self-observer
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py --once
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: GITHUB_TOKEN
        sync: false                  # read private consuming repos; absent => public-only
      - key: OBSERVER_JWT
        sync: false                  # Bearer to Tapestry services; unset => self-host tenant
      - key: TAPESTRY_ARCHITECTURE_REGISTRY_URL
        value: https://loom-architecture-registry.onrender.com  # existing deployed service
      - key: TAPESTRY_REGISTRY_URL
        value: https://loom-project-registry.onrender.com       # existing deployed service
      - key: TAPESTRY_PROJECT_ID
        value: 777f7bfa-1d02-466f-a20d-e3af7434c27e             # tapestry's own project row (registered 2026-09-05) so its self-candidates don't file under the-loom's id

