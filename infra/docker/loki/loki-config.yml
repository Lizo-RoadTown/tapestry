# Minimal Loki config for local dev-experience observability.
#
# Stores logs from Promtail (which tails ~/.claude/logs/hooks.jsonl on
# the host) for ~30 days. Single-binary mode — no sharding, no scaling.
# Sufficient for one developer's hook activity volume.
#
# Reference: https://grafana.com/docs/loki/latest/configure/

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h        # 30 days — single-developer scale
  max_query_series: 5000
  reject_old_samples: false

compactor:
  working_directory: /tmp/loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
