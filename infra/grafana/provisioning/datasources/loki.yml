# Loki datasource for Grafana — used by the dev-experience dashboard
# to query hook-event logs ingested by Promtail.
#
# Pattern source: platform/deploy/grafana/provisioning/datasources/postgres.yml
# (same shape, different driver).

apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      maxLines: 1000
    editable: true
