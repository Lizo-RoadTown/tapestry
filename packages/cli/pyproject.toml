[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tapestry-cli"
version = "0.1.0"
description = "the-loom command-line interface — onboard projects, inspect state, manage memory."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Liz Osborn", email = "lizocontactinfo@gmail.com"},
]
# Stdlib-only at runtime by design. Cross-platform Python (Windows / macOS / Linux),
# no compiled deps, no model downloads — `tapestry init` works the moment pip install completes.
dependencies = []

[project.scripts]
tapestry = "tapestry_cli.cli:main"
loom = "tapestry_cli.cli:main"  # deprecated alias

[project.urls]
Homepage = "https://github.com/Lizo-RoadTown/the-loom"
Repository = "https://github.com/Lizo-RoadTown/the-loom"

[tool.setuptools]
packages = ["tapestry_cli"]
